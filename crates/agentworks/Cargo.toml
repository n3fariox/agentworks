[package]
name = "agentworks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
agentworks-codex-acp = { path = "../agentworks-codex-acp" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
futures = "0.3"
uuid = { workspace = true, features = ["serde"] }
pulldown-cmark = "0.13"
ammonia = "4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
libc.workspace = true
agentworks-starlark = { path = "../agentworks-starlark" }
agentworks-terminal = { path = "../agentworks-terminal" }
agentworks-workspace = { path = "../agentworks-workspace" }
agentworks-runtime = { path = "../agentworks-runtime" }
agentworks-claude-acp = { path = "../agentworks-claude-acp" }
agentworks-session = { path = "../agentworks-session" }
