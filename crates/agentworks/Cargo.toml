[package]
name = "agentworks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
agentworks-codex-acp = { path = "../agentworks-codex-acp" }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
futures = "0.3"
jiff = "0.2.38"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { workspace = true, features = ["serde"] }
pulldown-cmark = "0.13"
ammonia = "4"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
libc.workspace = true
agentworks-starlark = { path = "../agentworks-starlark" }
agentworks-terminal = { path = "../agentworks-terminal" }
agentworks-workspace = { path = "../agentworks-workspace" }
agentworks-runtime = { path = "../agentworks-runtime" }
agentworks-claude-acp = { path = "../agentworks-claude-acp" }
agentworks-demo-acp = { path = "../agentworks-demo-acp" }
agentworks-session = { path = "../agentworks-session" }
goose = { path = "../../vendor/goose-1.56.0", version = "1.56.0", default-features = false, features = ["rustls-tls"] }

tracing-subscriber = { version = "0.3", features = ["fmt"] }

base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

rig-core = { version = "=0.45.0", default-features = false }
rig-reqwest = { version = "=0.45.0", default-features = false }
octocrab = { version = "0.54.6", default-features = false, features = ["default-client", "rustls", "rustls-aws-lc-rs", "timeout", "reqwest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Environment", "Win32_System_Threading"] }
