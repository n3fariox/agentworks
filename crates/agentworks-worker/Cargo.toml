[package]
name = "agentworks-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agentworks-worker"
path = "src/main.rs"

[features]
default = ["goose"]
# The embedded Goose harness and model-provider profiles; by far the largest dependency.
goose = ["dep:agentworks-goose-acp", "dep:tracing-subscriber", "agentworks-runtime/goose"]

[dependencies]
agentworks-claude-acp = { path = "../agentworks-claude-acp" }
agentworks-codex-acp = { path = "../agentworks-codex-acp" }
agentworks-demo-acp = { path = "../agentworks-demo-acp" }
agentworks-goose-acp = { path = "../agentworks-goose-acp", optional = true }
agentworks-runtime = { path = "../agentworks-runtime" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["fmt"], optional = true }
