[package]
name = "agentworks-goose-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
agentworks-runtime = { path = "../agentworks-runtime" }
goose = { path = "../../vendor/goose-1.56.0", version = "1.56.0", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
