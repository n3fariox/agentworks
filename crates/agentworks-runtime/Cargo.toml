[package]
name = "agentworks-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk"] }
agent-client-protocol.workspace = true
agentworks-terminal = { path = "../agentworks-terminal" }
agentworks-workspace = { path = "../agentworks-workspace" }
futures = "0.3"
http.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uuid.workspace = true

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
