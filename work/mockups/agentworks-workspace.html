<div class="aw-shell">
  <nav class="aw-rail" aria-label="Workspace navigation"><div class="aw-logo">a<span>·</span></div><button class="aw-nav" data-view="sessions" aria-pressed="true"><i data-lucide="messages-square" aria-hidden="true"></i><span>Sessions</span></button><button class="aw-nav" data-view="files" aria-pressed="false"><i data-lucide="folder-open" aria-hidden="true"></i><span>Files</span></button><button class="aw-nav" data-view="automations" aria-pressed="false"><i data-lucide="workflow" aria-hidden="true"></i><span>Automations</span></button><button class="aw-nav aw-rail-bottom" data-view="settings" aria-pressed="false"><i data-lucide="settings-2" aria-hidden="true"></i><span>Settings</span></button></nav>
  <header class="aw-topbar"><div class="aw-brand">agentworks<span style="color:var(--aw-accent)">.</span></div><div class="aw-context"><button class="aw-quiet aw-mobile-menu" data-action="drawer" aria-label="Show workspace sidebar"><i data-lucide="panel-left" aria-hidden="true"></i></button><select class="aw-select" id="aw-project" aria-label="Project"><option>Agentworks</option><option>Morsh</option></select><select class="aw-select" id="aw-host" aria-label="Host and location"><option value="local">Local · Linux</option><option value="devbox">Devbox · SSH</option></select></div><span class="aw-muted" style="font-size:11px"><span class="aw-dot"></span><span id="aw-connection">Connected</span></span></header>

  <main class="aw-main" id="aw-screen"></main>

<script>
(()=>{
const root=document.getElementById('aw-workspace-mock');
const screen=root.querySelector('#aw-screen'),side=root.querySelector('#aw-secondary');
const state={view:'sessions',file:'docs/sessions.md',filePane:true,source:false,group:'projects',project:'Agentworks',host:'local',run:false,runKind:'review',approved:false,posted:true,enabled:true,automation:'review',drawer:false,navigation:'rail',filePosition:'right',accent:'#b9a4ff',extraMessage:'',roots:['/home/captain/projects']};
const files={'README.md':{title:'Agentworks',markdown:'<h2>Agentworks</h2><p>A local workspace for your coding agents.</p><h3>Your workspace</h3><p>Keep conversations, project files, and automated work together across your machines.</p><h3>Run locally</h3><pre class="aw-code"><code>cargo run --locked</code></pre>',source:'# Agentworks\n\nA local workspace for your coding agents.\n\n## Run locally\n\ncargo run --locked'},'docs/sessions.md':{title:'Session persistence',markdown:'<h2>Session persistence</h2><p>A restart should feel like picking up where you left off.</p><h3>How it works</h3><ol><li>Save transcript events and session settings as they arrive.</li><li>Keep the harness conversation ID alongside the working directory.</li><li>Reconnect to the original conversation when you open it again.</li></ol><h3>Interrupted work</h3><p>Mark an interrupted turn clearly. Let the person decide what to do next.</p>',source:'# Session persistence\n\nA restart should feel like picking up where you left off.\n\n## How it works\n\n1. Save transcript events and session settings.\n2. Keep the harness conversation ID.\n3. Reconnect to the original conversation.\n\n## Interrupted work\n\nMark an interrupted turn clearly.'},'src/store.rs':{title:'store.rs',source:'pub struct Store {\n    connection: Connection,\n}\n\nimpl Store {\n    pub fn save_event(\n        &mut self,\n        session: &Session,\n        event: &Event,\n    ) -> Result<()> {\n        let tx = self.connection.transaction()?;\n        tx.save(session, event)?;\n        tx.commit()?;\n        Ok(())\n    }\n}'},'screenshots/session-layout.png':{title:'session-layout.png',image:true}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const btn=(action,label,cls='aw-action')=>'<button class="'+cls+'" data-action="'+action+'">'+label+'</button>';
const location=()=>'/home/captain/projects/'+state.project.toLowerCase();
function save(){const api=window.openai;if(api?.setWidgetState)api.setWidgetState({modelContent:{view:state.view,project:state.project,host:state.host,filePane:state.filePane,navigation:state.navigation,filePosition:state.filePosition},privateContent:{file:state.file,source:state.source,group:state.group,automation:state.automation,runKind:state.runKind,approved:state.approved,posted:state.posted,enabled:state.enabled,run:state.run,accent:state.accent}}).catch(()=>{});}
function restore(saved){if(!saved||typeof saved!=='object')return;for(const part of [saved.modelContent,saved.privateContent])if(part&&typeof part==='object')for(const key of Object.keys(state))if(Object.hasOwn(part,key)&&typeof part[key]===typeof state[key])state[key]=part[key];if(!['sessions','files','automations','settings'].includes(state.view))state.view='sessions';if(!files[state.file])state.file='docs/sessions.md';}
function tree(){return '<div class="aw-tree"><div class="aw-group-label">'+icon('folder')+' '+esc(state.project.toLowerCase())+'</div>'+Object.keys(files).map(file=>'<button class="aw-side-item '+(state.file===file?'aw-selected':'')+'" data-file="'+file+'">'+icon(file.endsWith('.png')?'image':'file-text')+'<span>'+esc(file.split('/').at(-1))+'</span></button>').join('')+'</div>';}
function renderSide(){
 if(state.view==='files'){side.innerHTML='<div class="aw-side-title"><span>PROJECT FILES</span>'+icon('folder-open')+'</div>'+tree()+'<div class="aw-side-foot">'+esc(state.host==='local'?'Local':'Devbox')+'<br>'+esc(location())+'</div>';return;}
 if(state.view==='automations'){side.innerHTML='<div class="aw-side-title"><span>AUTOMATIONS</span>'+icon('workflow')+'</div>'+[['review','Review pull requests','GitHub · Pull request'],['triage','Daily issue triage','Schedule · Weekdays, 09:00'],['release','Draft release notes','GitHub · New tag']].map(([id,label,detail])=>'<button class="aw-side-item '+(state.automation===id?'aw-selected':'')+'" data-automation="'+id+'"><span>'+label+'<small>'+detail+'</small></span></button>').join('')+'<div class="aw-side-foot">'+icon('github')+' captain/'+state.project.toLowerCase()+'<br>Connected through host CLI</div>';return;}
 if(state.view==='settings'){side.innerHTML='<div class="aw-side-title">SETTINGS</div><div class="aw-side-item aw-selected">Host defaults</div><div class="aw-side-foot">'+esc(state.host==='local'?'Local Linux host':'Devbox via SSH')+'</div>';return;}
 side.innerHTML=btn('new-session',icon('plus')+' New session','aw-action aw-primary aw-full')+'<div class="aw-groups" aria-label="Group sessions"><button data-group="hosts" aria-pressed="'+(state.group==='hosts')+'">Hosts</button><button data-group="projects" aria-pressed="'+(state.group==='projects')+'">Projects</button></div><div class="aw-side-title">SESSIONS</div><div class="aw-group-label">'+icon(state.group==='projects'?'folder':'server')+' '+esc(state.group==='projects'?state.project:'Local')+'</div><div class="aw-group-label" style="margin-left:20px">'+icon(state.group==='projects'?'server':'folder')+' '+esc(state.group==='projects'?'Local':state.project)+'</div><button class="aw-side-item '+(!state.run?'aw-selected':'')+'" data-action="manual-session"><span>Session persistence<small>Codex · Ready</small></span></button><button class="aw-side-item '+(state.run?'aw-selected':'')+'" data-action="run-session">'+icon('workflow')+'<span>Review PR #142<small>Claude · '+(state.approved?'Completed':'Needs approval')+'</small></span></button><button class="aw-side-item" data-action="file-session"><span>Inspect project structure<small>Claude · Ready</small></span></button><div class="aw-group-label">'+icon(state.group==='projects'?'folder':'server')+' '+esc(state.group==='projects'?'Morsh':'Devbox')+'</div><button class="aw-side-item" data-action="other-project"><span>Terminal resize handling<small>Codex · Ready</small></span></button><div class="aw-side-foot"><span class="aw-dot"></span>Sessions saved on this host</div>';
}
function filePane(full=false){const file=files[state.file]||files['README.md'];const body=file.image?'<h3>session-layout.png</h3><div class="aw-mini-preview" role="img" aria-label="Preview of a dark workspace screenshot"><div class="aw-mini-head"><span></span><span></span><span></span></div><div class="aw-mini-body"><div class="aw-mini-side"></div><div class="aw-mini-lines"><span></span><span></span><span></span><span></span><span></span></div></div></div><p class="aw-muted">PNG image · 1280 × 800</p>':state.source||!file.markdown?'<pre class="aw-code"><code>'+esc(file.source)+'</code></pre>':file.markdown;return '<section class="aw-file-pane" aria-label="File preview"><div class="aw-file-head"><span>'+icon(file.image?'image':'file-text')+' '+esc(state.file)+'</span>'+(!full?btn('close-file',icon('x'),'aw-quiet'):'')+'</div>'+(!file.image?'<div class="aw-file-tabs"><button data-action="file-preview" aria-pressed="'+!state.source+'">Preview</button><button data-action="file-source" aria-pressed="'+state.source+'">Source</button></div>':'')+'<div class="aw-file-content">'+body+'</div><div class="aw-file-bottom">'+btn('ask-file',icon('messages-square')+' Ask about this file','aw-action aw-full')+'</div></section>';}
function composer(){return '<div class="aw-composer"><div class="aw-input-wrap">'+(state.extraMessage?'<div class="aw-tag" style="margin-bottom:10px">'+icon('file-text')+' '+esc(state.file)+'</div>':'')+'<textarea id="aw-message" aria-label="Message your agent" placeholder="What would you like to work on?" rows="2"></textarea><div class="aw-composer-actions"><span>'+esc(state.run?'Claude':'Codex')+' · '+esc(state.host==='local'?'Local':'Devbox')+'</span>'+btn('send','Send ↑','aw-action aw-primary')+'</div></div><div class="aw-composer-foot">'+esc(state.project)+' · Chat session</div></div>';}
function session(){
 const manual='<article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">Y</span>You <span>11:42</span></div><p>Walk me through how sessions survive a restart. Put the notes in <code>docs/sessions.md</code>.</p></article><article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">⌘</span>Codex</div><p>The conversation is saved as it happens. When you return, the harness reconnects using the original session ID.</p><div class="aw-tool"><span>'+icon('check')+' Read <code>src/store.rs</code></span><span>Done</span></div><p>I’ve written up the storage and recovery flow, including what happens to interrupted turns.</p><button class="aw-artifact" data-file="docs/sessions.md">'+icon('file-text')+'<span>Session persistence<small>docs/sessions.md</small></span><span class="aw-open">↗</span></button></article>';
 const automated='<article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">'+icon('workflow')+'</span>Review pull requests · Run #42</div><p>Review pull request <strong>#142</strong>: “Preserve sessions through server updates”. Focus on restart recovery and duplicate events.</p></article><article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">✳</span>Claude</div><div class="aw-tool"><span>'+icon('check')+' Read pull request diff</span><span>Done</span></div><p>The persistence flow looks sound. I found one case worth testing: reconnecting while the final transcript update is being saved.</p><p>I’ve prepared a review with that finding and a suggested test.</p></article>'+(state.approved?'<div class="aw-tag aw-success">'+icon('check')+(state.posted?' Review posted · Run complete':' Review kept as draft · Run complete')+'</div>':'<div class="aw-approval"><strong>Post review to GitHub?</strong><p>Send the prepared review to pull request #142.</p><div class="aw-buttons">'+btn('approve','Approve once','aw-action aw-primary')+btn('deny','Keep as draft')+'</div></div>');
 return '<div class="aw-session-head"><div>'+(state.run?'<button class="aw-quiet" data-action="back-automation" style="padding-left:0">← Review pull requests / Run #42</button>':'<div class="aw-kicker">'+esc(state.project)+' / '+esc(state.host==='local'?'Local':'Devbox')+'</div>')+'<h1>'+(state.run?'Review PR #142':'Session persistence')+'</h1><div class="aw-meta"><span>'+esc(state.run?'Claude':'Codex')+'</span><span class="aw-dot"></span><span>'+(state.run&&!state.approved?'Needs approval':'Ready')+'</span>'+(state.run?'<span class="aw-tag">'+icon('workflow')+' Automation</span>':'')+'</div></div>'+btn('toggle-files',icon('panel-right')+' '+(state.filePane?'Hide file':'Files'),'aw-action')+'</div><div class="aw-workarea '+(state.filePane?'aw-with-file':'')+'"><section class="aw-chat" aria-label="Conversation">'+(state.run?automated:manual)+(state.extraMessage?'<article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">Y</span>You</div><p>'+esc(state.extraMessage)+'</p></article><article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">⌘</span>Codex</div><p>The notes cover saving events, reopening the original harness conversation, and making interrupted turns visible.</p></article>':'')+composer()+'</section>'+(state.filePane?filePane():'')+'</div>';
}
const automations={review:{title:'Review pull requests',description:'A first review when a pull request is ready.',trigger:'Pull request opened or ready for review',detail:'captain/PROJECT · Poll every 60 seconds',agent:'Claude',prompt:'Review the pull request diff. Focus on correctness, missing tests, and restart behavior. Prepare a concise review; ask before posting it.'},triage:{title:'Daily issue triage',description:'Make an actionable shortlist for the day.',trigger:'Weekdays at 09:00',detail:'America/Chicago · Skip overlapping runs',agent:'Codex',prompt:'Read new and recently updated issues. Group related reports and draft a short daily triage note in docs/triage.md.'},release:{title:'Draft release notes',description:'Turn merged changes into a release draft.',trigger:'A new version tag appears',detail:'captain/PROJECT · Poll every 60 seconds',agent:'Claude',prompt:'Summarize changes since the previous version. Write a release draft covering fixes, features, and any migration steps. Ask before publishing.'}};
function automation(){const a=automations[state.automation]||automations.review;let html='<section class="aw-content"><div class="aw-page-head"><div><div class="aw-kicker">AUTOMATIONS / '+esc(state.project.toUpperCase())+'</div><h1>'+a.title+'</h1><p>'+a.description+'</p></div><label class="aw-switch"><input id="aw-enabled" type="checkbox" '+(state.enabled?'checked':'')+'> '+(state.enabled?'Enabled':'Paused')+'</label></div><div class="aw-rule"><div><div class="aw-rule-label">WHEN</div><strong>'+icon(state.automation==='triage'?'clock-3':'github')+' '+a.trigger+'</strong><small>'+a.detail.replace('PROJECT',state.project.toLowerCase())+'</small></div><div><div class="aw-rule-label">START A SESSION</div><strong>'+a.agent+' · '+esc(state.host==='local'?'Local':'Devbox')+'</strong><small>'+esc(location())+'</small></div></div><h3>Agent instructions</h3><div class="aw-prompt">'+a.prompt+'</div><div class="aw-page-head" style="margin-bottom:8px"><h2>Recent runs</h2>'+btn('run-now',icon('play')+' Run now','aw-action')+'</div><div class="aw-run-head"><span>Trigger</span><span>Status</span><span>Started</span></div><button class="aw-run-row" data-action="run-session"><span>Pull request #142<small>Preserve sessions through updates</small></span><span class="aw-tag '+(state.approved?'aw-success':'aw-warning')+'">'+(state.approved?'Completed':'Needs approval')+'</span><time>2m ago</time></button><div class="aw-run-row"><span>Pull request #141<small>Handle browser reconnects</small></span><span class="aw-tag aw-success">Completed</span><time>1h ago</time></div><div class="aw-run-row"><span>Manual run<small>Started by you</small></span><span class="aw-muted">Completed</span><time>Yesterday</time></div></section>';if(state.automation==='triage')html=html.replace('Pull request #142','Scheduled · Today').replace('Preserve sessions through updates','Daily issue shortlist').replace('Pull request #141','Scheduled · Yesterday').replace('Handle browser reconnects','Daily issue shortlist').replace('Needs approval','Completed');if(state.automation==='release')html=html.replace('Pull request #142','Tag v0.2.0').replace('Preserve sessions through updates','Release notes draft').replace('Pull request #141','Tag v0.1.0').replace('Handle browser reconnects','Release notes draft').replace('Needs approval','Completed');return html;}
function settings(){return '<section class="aw-content"><div class="aw-page-head"><div><div class="aw-kicker">SETTINGS / '+esc(state.host==='local'?'LOCAL':'DEVBOX')+'</div><h1>Host defaults</h1><p>Models and directories for new sessions.</p></div></div><div class="aw-field"><label for="aw-claude">Claude default model</label><select id="aw-claude" class="aw-select"><option>Harness default</option><option>Opus</option><option>Sonnet</option></select></div><div class="aw-field"><label for="aw-codex">Codex default model</label><select id="aw-codex" class="aw-select"><option>Harness default</option><option>Last used model</option></select></div><div style="display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px"><h3>Allowed roots</h3>'+btn('add-root','＋ Add root','aw-quiet')+'</div>'+state.roots.map((path,index)=>'<div class="aw-root-row"><input aria-label="Allowed root '+(index+1)+'" value="'+esc(path)+'"><button class="aw-quiet" data-remove-root="'+index+'" aria-label="Remove root '+(index+1)+'">'+icon('x')+'</button></div>').join('')+'<div class="aw-muted" style="font-size:11px;margin-top:10px">Project locations must be inside an allowed root.</div></section>';}
function render(){
 root.classList.toggle('aw-files-view',state.view==='files');root.classList.toggle('aw-drawer',state.drawer);root.classList.toggle('aw-label-nav',state.navigation==='sidebar');root.classList.toggle('aw-below',state.filePosition==='below');root.style.setProperty('--aw-accent',state.accent);
 root.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===state.view)));
 root.querySelector('#aw-project').value=state.project;root.querySelector('#aw-host').value=state.host;
 renderSide();screen.innerHTML=state.view==='files'?'<div class="aw-session-head"><div><div class="aw-kicker">FILES / '+esc(state.project.toUpperCase())+'</div><h1>'+esc(state.file.split('/').at(-1))+'</h1><div class="aw-meta">'+esc(location())+'</div></div>'+btn('ask-file',icon('messages-square')+' Open in chat')+'</div>'+filePane(true):state.view==='automations'?automation():state.view==='settings'?settings():session();
 if(state.view==='sessions'&&state.run&&state.runKind!=='review'){
  const a=automations[state.runKind]||automations.review;
  screen.querySelector('h1').textContent=a.title;
  screen.querySelector('[data-action="back-automation"]').textContent='← '+a.title+' / Run #42';
  screen.querySelector('.aw-meta').innerHTML='<span>'+a.agent+'</span><span class="aw-tag aw-success">Completed</span><span class="aw-tag">Automation</span>';
  screen.querySelector('.aw-chat').innerHTML='<article class="aw-message"><div class="aw-message-label">'+icon('workflow')+' '+a.title+' · Run #42</div><p>'+a.prompt+'</p></article><article class="aw-message"><div class="aw-message-label"><span class="aw-avatar">'+(a.agent==='Codex'?'⌘':'✳')+'</span>'+a.agent+'</div><p>'+(state.runKind==='triage'?'I grouped the new issues and wrote a shortlist with suggested next steps to docs/triage.md.':'The release draft is ready. It covers fixes, new features, and migration steps since the previous version.')+'</p><span class="aw-tag aw-success">Draft saved</span></article>'+composer();
 }
 if(globalThis.lucide)lucide.createIcons({root,attrs:{width:16,height:16}});
}
root.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||!root.contains(button))return;
 if(button.dataset.view){state.view=button.dataset.view;state.drawer=false;}
 else if(button.dataset.file){state.file=button.dataset.file;state.filePane=true;state.source=false;state.drawer=false;}
 else if(button.dataset.group)state.group=button.dataset.group;
 else if(button.dataset.automation)state.automation=button.dataset.automation;
 else if(button.dataset.removeRoot!==undefined)state.roots.splice(Number(button.dataset.removeRoot),1);
 else switch(button.dataset.action){
 case 'drawer':state.drawer=!state.drawer;break;
 case 'toggle-files':state.filePane=!state.filePane;break;
 case 'close-file':state.filePane=false;break;
 case 'file-preview':state.source=false;break;
 case 'file-source':state.source=true;break;
 case 'ask-file':state.view='sessions';state.run=false;state.filePane=true;state.extraMessage='Summarize '+state.file+' and explain how it relates to this session.';break;
 case 'manual-session':case 'new-session':state.view='sessions';state.run=false;state.extraMessage='';state.drawer=false;break;
 case 'file-session':state.view='files';state.drawer=false;break;
 case 'other-project':state.project=state.project==='Agentworks'?'Morsh':'Agentworks';state.view='sessions';state.run=false;state.drawer=false;break;
 case 'run-session':state.runKind=state.view==='automations'?state.automation:'review';state.view='sessions';state.run=true;state.extraMessage='';state.filePane=false;state.drawer=false;break;
 case 'completed-run':state.view='sessions';state.run=true;state.approved=true;state.filePane=false;break;
 case 'back-automation':state.automation=state.runKind;state.view='automations';break;
 case 'run-now':state.runKind=state.automation;state.view='sessions';state.run=true;state.approved=false;state.filePane=false;break;
 case 'approve':state.approved=true;state.posted=true;break;
 case 'deny':state.approved=true;state.posted=false;break;
 case 'send':{const input=root.querySelector('#aw-message');if(!input?.value.trim())return;state.extraMessage=input.value.trim();break;}
 case 'add-root':state.roots.push('');break;
 default:return;
 }
 render();save();
});
root.addEventListener('change',event=>{if(event.target.id==='aw-project'){state.project=event.target.value;state.file='README.md';}else if(event.target.id==='aw-host')state.host=event.target.value;else if(event.target.id==='aw-enabled')state.enabled=event.target.checked;else return;render();save();});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(state,'navigation',{label:'Navigation style',options:[{label:'Icon rail',value:'rail'},{label:'Labels beside icons',value:'sidebar'}]});tweak.addSelect(state,'filePosition',{label:'File preview placement',options:[{label:'Beside conversation',value:'right'},{label:'Below conversation',value:'below'}]});tweak.addToggle(state,'filePane',{label:'File preview open'});tweak.addColorPicker(state,'accent',{label:'Accent',reference:'--aw-accent'});}
})();
</script>
</div>
