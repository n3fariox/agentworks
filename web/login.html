<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Agentworks · Sign in</title><link rel="stylesheet" href="./shell.css"><script type="module" src="./login.js"></script>
<style>body{min-height:100vh;display:grid;place-items:center;padding:16px}form{width:min(340px,100%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:26px;display:flex;flex-direction:column;gap:8px}h1{margin:0 0 4px;font-size:20px;letter-spacing:-.5px}h1 span{color:var(--accent)}p{margin:0 0 10px;color:var(--muted);font-size:12px}label{font-size:12px;color:var(--muted);margin-top:6px}input{background:var(--bg);color:var(--text);border-radius:7px;padding:10px 11px}.primary{margin-top:14px;justify-content:center}#login-error{color:#ff9a9a;font-size:12px;min-height:1.4em;margin:4px 0 0}</style>
</head>
<body>
<form id="login-form">
  <h1>agent<span>works</span></h1>
  <p>Sign in with your account on this host.</p>
  <label for="login-username">Username</label><input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required>
  <button class="primary" id="login-submit" type="submit">Sign in</button>
  <p id="login-error" role="alert"></p>
</form>
</body>
</html>
