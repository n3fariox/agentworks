# Normalized from the pinned upstream workspace; see ../GOOSE-SOURCES.md.
[package]
"name" = "goose"
"version" = "1.56.0"
"edition" = "2021"
"rust-version" = "1.94.1"
"authors" = ["AAIF <ai-oss-tools@block.xyz>"]
"license" = "Apache-2.0"
"repository" = "https://github.com/aaif-goose/goose"
"description" = "An AI agent"
"metadata" = {"cargo-machete" = {"ignored" = ["winapi"]}}
[features]
"default" = []
"online-model-meta" = []
"telemetry" = []
"otel" = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-appender-tracing", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout"]
"code-mode" = ["dep:boa_engine"]
"tree-sitter" = ["dep:tree-sitter", "dep:tree-sitter-go", "dep:tree-sitter-java", "dep:tree-sitter-javascript", "dep:tree-sitter-kotlin-ng", "dep:tree-sitter-python", "dep:tree-sitter-ruby", "dep:tree-sitter-rust", "dep:tree-sitter-swift", "dep:tree-sitter-typescript"]
"live-voice" = ["goose-providers/live-websocket"]
"local-inference" = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "goose-providers/local-inference-hf-hub", "dep:tokenizers", "dep:symphonia", "dep:rubato", "dep:byteorder"]
"aws-providers" = ["dep:aws-config", "dep:aws-smithy-types", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-runtime-api", "dep:aws-sdk-sagemakerruntime", "dep:smithy-transport-reqwest"]
"cuda" = ["local-inference", "candle-core/cuda", "candle-nn/cuda", "goose-providers/cuda"]
"vulkan" = ["local-inference", "goose-providers/vulkan"]
"mlx" = ["local-inference", "goose-providers/mlx"]
"rustls-tls" = ["dep:rustls", "dep:rcgen", "dep:pem", "dep:axum-server", "dep:aws-lc-rs", "axum-server/tls-rustls", "rcgen/aws_lc_rs", "reqwest/rustls", "rmcp/reqwest", "smithy-transport-reqwest?/rustls", "sqlx/tls-rustls", "jsonwebtoken/aws_lc_rs", "oauth2/reqwest", "oauth2/rustls-tls", "goose-providers/rustls-tls", "goose-context-management/rustls-tls"]
"native-tls" = ["dep:rcgen", "dep:pem", "dep:axum-server", "dep:openssl", "axum-server/tls-openssl", "rcgen/ring", "reqwest/native-tls", "rmcp/reqwest-native-tls", "smithy-transport-reqwest?/native-tls", "sqlx/tls-native-tls", "jsonwebtoken/rust_crypto", "oauth2/reqwest", "oauth2/native-tls", "goose-providers/native-tls", "goose-context-management/native-tls"]
"system-keyring" = ["dep:keyring"]
"portable-default" = ["rustls-tls", "tree-sitter", "live-voice", "aws-providers", "telemetry", "otel", "scheduler", "platform-apps", "chat-recall", "acp-http"]
"platform-apps" = []
"chat-recall" = []
"scheduler" = ["dep:tokio-cron-scheduler"]
"acp-http" = ["dep:agent-client-protocol-http"]
[dependencies]
"lru" = {"version" = "0.18", "default-features" = false}
"rmcp" = {"version" = "3.4.1", "default-features" = false, "features" = ["auth", "client", "schemars", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-streamable-http-client-unix-socket"]}
"oauth2" = {"version" = "5.0", "default-features" = false}
"arboard" = {"version" = "3", "default-features" = false}
"anyhow" = {"version" = "1.0.102", "default-features" = false, "features" = ["std"]}
"thiserror" = {"version" = "2.0.18", "default-features" = false}
"futures" = {"version" = "0.3.32", "default-features" = false, "features" = ["std"]}
"dirs" = {"version" = "7", "default-features" = false}
"reqwest" = {"version" = "0.13.2", "default-features" = false, "features" = ["blocking", "brotli", "charset", "cookies", "deflate", "form", "gzip", "http2", "json", "multipart", "stream", "system-proxy", "zstd"]}
"tokio" = {"version" = "1.48", "default-features" = false, "features" = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]}
"serde" = {"version" = "1.0.228", "default-features" = false, "features" = ["derive", "std"]}
"serde_json" = {"version" = "1.0.145", "default-features" = false, "features" = ["std"]}
"serde_path_to_error" = {"version" = "0.1.8", "default-features" = false}
"serde_urlencoded" = {"version" = "0.7.1", "default-features" = false}
"jsonschema" = {"version" = "0.55", "default-features" = false}
"uuid" = {"version" = "1.23", "default-features" = false, "features" = ["std", "v4", "v7"]}
"regex" = {"version" = "1.12.3", "default-features" = false, "features" = ["std"]}
"async-trait" = {"version" = "0.1.89", "default-features" = false}
"async-stream" = {"version" = "0.3.6", "default-features" = false}
"minijinja" = {"version" = "2.18", "default-features" = false, "features" = ["loader", "multi_template", "serde", "builtins"]}
"include_dir" = {"version" = "0.7", "default-features" = false}
"tiktoken-rs" = {"version" = "0.12", "default-features" = false}
"chrono" = {"version" = "0.4.44", "default-features" = false, "features" = ["serde", "std"]}
"clap" = {"version" = "4.1.14", "default-features" = false, "features" = ["derive", "std", "help", "suggestions", "usage", "color", "error-context"]}
"indoc" = {"version" = "2", "default-features" = false}
"nanoid" = {"version" = "0.5", "default-features" = false}
"sha2" = {"version" = "0.11", "default-features" = false}
"base64" = {"version" = "0.23.0", "default-features" = false, "features" = ["std"]}
"url" = {"version" = "2.5.4", "default-features" = false, "features" = ["std"]}
"axum" = {"version" = "0.8", "default-features" = false, "features" = ["http1", "http2", "json", "query", "tokio", "ws"]}
"webbrowser" = {"version" = "1", "default-features" = false}
"tracing" = {"version" = "0.1.43", "default-features" = false, "features" = ["std"]}
"tracing-subscriber" = {"version" = "0.3.22", "default-features" = false, "features" = ["ansi", "env-filter", "fmt", "json", "std", "time"]}
"tracing-futures" = {"version" = "0.2.4", "default-features" = false, "features" = ["futures-03", "std", "std-future"]}
"tracing-opentelemetry" = {"version" = "0.33", "default-features" = false, "features" = ["metrics"], "optional" = true}
"opentelemetry" = {"version" = "0.32", "default-features" = false, "optional" = true}
"opentelemetry_sdk" = {"version" = "0.32", "default-features" = false, "features" = ["metrics"], "optional" = true}
"opentelemetry-appender-tracing" = {"version" = "0.32", "default-features" = false, "features" = ["experimental_span_attributes"], "optional" = true}
"opentelemetry-otlp" = {"version" = "0.32", "default-features" = false, "features" = ["http-proto", "internal-logs", "logs", "metrics", "reqwest-client", "trace"], "optional" = true}
"opentelemetry-stdout" = {"version" = "0.32", "default-features" = false, "features" = ["trace", "metrics", "logs"], "optional" = true}
"keyring" = {"version" = "3.6.3", "default-features" = false, "features" = ["vendored"], "optional" = true}
"serde_yaml" = {"version" = "0.9.32", "default-features" = false}
"strum" = {"version" = "0.28.0", "default-features" = false, "features" = ["derive", "std"]}
"once_cell" = {"version" = "1.21.3", "default-features" = false, "features" = ["std"]}
"etcetera" = {"version" = "0.11", "default-features" = false}
"fs-err" = {"version" = "3.1", "default-features" = false}
"goose-context-management" = {"git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"goose-providers" = {"default-features" = false, "git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"goose-download-manager" = {"git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"goose-sdk-types" = {"git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"goose-agent" = {"git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"rand" = {"version" = "0.10.1"}
"tokio-cron-scheduler" = {"version" = "0.15", "default-features" = false, "optional" = true}
"urlencoding" = {"version" = "2.1", "default-features" = false}
"v_htmlescape" = {"version" = "0.17", "default-features" = false, "features" = ["std"]}
"sqlx" = {"version" = "0.9.0", "default-features" = false, "features" = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"]}
"aws-config" = {"version" = "=1.12.0", "default-features" = false, "features" = ["credentials-process", "rt-tokio", "sso", "behavior-version-latest"], "optional" = true}
"aws-smithy-types" = {"version" = "=1.6.3", "default-features" = false, "features" = ["rt-tokio"], "optional" = true}
"aws-sdk-bedrockruntime" = {"version" = "=1.143.0", "default-features" = false, "features" = ["rt-tokio"], "optional" = true}
"aws-smithy-runtime-api" = {"version" = "=1.16.0", "default-features" = false, "features" = ["client"], "optional" = true}
"smithy-transport-reqwest" = {"version" = "0.1", "default-features" = false, "features" = ["http2", "system-proxy"], "optional" = true}
"aws-sdk-sagemakerruntime" = {"version" = "=1.113.0", "default-features" = false, "features" = ["rt-tokio"], "optional" = true}
"jsonwebtoken" = {"version" = "11.0", "default-features" = false, "features" = ["use_pem"]}
"blake3" = {"version" = "1", "default-features" = false, "features" = ["std"]}
"fs2" = {"version" = "0.4", "default-features" = false}
"tokio-stream" = {"version" = "0.1.16", "default-features" = false, "features" = ["io-util"]}
"tempfile" = {"version" = "3.10.1", "default-features" = false}
"tokio-util" = {"version" = "0.7.12", "default-features" = false, "features" = ["compat", "rt"]}
"agent-client-protocol-schema" = {"version" = "=1.9.1", "default-features" = false}
"agent-client-protocol" = {"version" = "2.2.0", "default-features" = false, "features" = ["unstable_end_turn_token_usage", "unstable_session_fork"]}
"agent-client-protocol-http" = {"version" = "2.2.0", "default-features" = false, "features" = ["server"], "optional" = true}
"unicode-normalization" = {"version" = "0.1.22", "default-features" = false, "features" = ["std"]}
"candle-core" = {"version" = "0.11", "default-features" = false, "optional" = true}
"candle-nn" = {"version" = "0.11", "default-features" = false, "optional" = true}
"candle-transformers" = {"version" = "0.11", "default-features" = false, "optional" = true}
"byteorder" = {"version" = "1.5", "default-features" = false, "features" = ["std"], "optional" = true}
"tokenizers" = {"version" = "0.23", "default-features" = false, "features" = ["onig"], "optional" = true}
"symphonia" = {"version" = "0.6", "default-features" = false, "features" = ["aac", "adpcm", "alac", "isomp4", "mkv", "mp3", "pcm", "vorbis", "wav"], "optional" = true}
"rubato" = {"version" = "5.0", "default-features" = false, "optional" = true}
"sys-info" = {"version" = "0.9", "default-features" = false}
"schemars" = {"version" = "1.0.2", "default-features" = false, "features" = ["derive", "std"]}
"shellexpand" = {"version" = "3", "default-features" = false, "features" = ["base-0", "tilde"]}
"indexmap" = {"version" = "2.9", "default-features" = false, "features" = ["serde", "std"]}
"ignore" = {"version" = "0.4.12", "default-features" = false}
"rayon" = {"version" = "1.10", "default-features" = false}
"tree-sitter" = {"version" = "0.26", "default-features" = false, "features" = ["std"], "optional" = true}
"tree-sitter-go" = {"version" = "0.25", "default-features" = false, "optional" = true}
"tree-sitter-java" = {"version" = "0.23", "default-features" = false, "optional" = true}
"tree-sitter-javascript" = {"version" = "0.25", "default-features" = false, "optional" = true}
"tree-sitter-kotlin-ng" = {"version" = "1", "default-features" = false, "optional" = true}
"tree-sitter-python" = {"version" = "0.25", "default-features" = false, "optional" = true}
"tree-sitter-ruby" = {"version" = "0.23", "default-features" = false, "optional" = true}
"tree-sitter-rust" = {"version" = "0.24", "default-features" = false, "optional" = true}
"tree-sitter-swift" = {"version" = "0.7", "default-features" = false, "optional" = true}
"tree-sitter-typescript" = {"version" = "0.23", "default-features" = false, "optional" = true}
"which" = {"version" = "8", "default-features" = false, "features" = ["real-sys"]}
"pastey" = {"version" = "0.2", "default-features" = false}
"shell-words" = {"version" = "1", "default-features" = false, "features" = ["std"]}
"goose-acp-macros" = {"default-features" = false, "git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"tower-http" = {"version" = "0.7.0", "default-features" = false, "features" = ["cors"]}
"tracing-appender" = {"version" = "0.2.1", "default-features" = false}
"rustls" = {"version" = "0.23.31", "default-features" = false, "features" = ["aws_lc_rs", "std"], "optional" = true}
"rcgen" = {"version" = "0.14", "default-features" = false, "features" = ["crypto", "pem"], "optional" = true}
"axum-server" = {"version" = "0.8", "default-features" = false, "optional" = true}
"aws-lc-rs" = {"version" = "1.17", "default-features" = false, "optional" = true}
"openssl" = {"version" = "0.10.66", "default-features" = false, "optional" = true}
"pem" = {"version" = "4.0.0", "default-features" = false, "features" = ["std"], "optional" = true}
"image" = {"version" = "0.24.9", "default-features" = false, "features" = ["png", "jpeg", "gif", "webp"]}
"subtle" = {"version" = "2.5", "default-features" = false, "features" = ["std"]}
"gethostname" = "1.1.0"
"boa_engine" = {"version" = "0.22", "default-features" = false, "optional" = true, "features" = ["fuzz"]}
[target]
"cfg(target_os = \"windows\")" = {"dependencies" = {"winapi" = {"version" = "0.3.9", "default-features" = false, "features" = ["accctrl", "aclapi", "fileapi", "handleapi", "jobapi2", "minwinbase", "processthreadsapi", "sddl", "securitybaseapi", "std", "synchapi", "winbase", "wincred", "winerror"]}, "keyring" = {"version" = "3.6.3", "default-features" = false, "features" = ["vendored", "windows-native"], "optional" = true}, "ntapi" = {"version" = "0.4.3", "default-features" = false, "features" = ["user"]}}}
"cfg(target_os = \"macos\")" = {"dependencies" = {"candle-core" = {"version" = "0.11", "default-features" = false, "features" = ["metal"], "optional" = true}, "candle-nn" = {"version" = "0.11", "default-features" = false, "features" = ["metal"], "optional" = true}, "keyring" = {"version" = "3.6.3", "default-features" = false, "features" = ["apple-native", "vendored"], "optional" = true}}}
"cfg(target_os = \"linux\")" = {"dependencies" = {"keyring" = {"version" = "3.6.3", "default-features" = false, "features" = ["sync-secret-service", "vendored"], "optional" = true}}}
"cfg(unix)" = {"dependencies" = {"libc" = {"version" = "0.2.182", "default-features" = false, "features" = ["std"]}}}
[dev-dependencies]
"serial_test" = {"version" = "4", "default-features" = false}
"mockall" = {"version" = "0.15", "default-features" = false}
"wiremock" = {"version" = "0.6", "default-features" = false}
"tokio" = {"version" = "1.48", "default-features" = false, "features" = ["test-util"]}
"tokio-util" = {"version" = "0.7.12", "default-features" = false, "features" = ["compat"]}
"dotenvy" = {"version" = "0.15.7", "default-features" = false}
"ctor" = {"version" = "1.0", "default-features" = false, "features" = ["proc_macro"]}
"test-case" = {"version" = "3", "default-features" = false}
"env-lock" = {"version" = "1", "default-features" = false}
"rmcp" = {"version" = "3.4.1", "default-features" = false, "features" = ["schemars", "transport-streamable-http-server"]}
"opentelemetry_sdk" = {"version" = "0.32", "default-features" = false, "features" = ["metrics", "testing"]}
"goose-test-support" = {"default-features" = false, "git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"bytes" = {"version" = "1.10.1", "default-features" = false, "features" = ["std"]}
"http" = {"version" = "1.1", "default-features" = false, "features" = ["std"]}
"goose-mcp" = {"default-features" = false, "git" = "https://github.com/aaif-goose/goose.git", "rev" = "2b17adc33a7176e701c2fef9578a5fc5834ea89a"}
"insta" = {"version" = "1", "default-features" = false}
"dtor" = {"version" = "1.0.5", "default-features" = false, "features" = ["proc_macro"]}
"tower" = {"version" = "0.5.2", "default-features" = false, "features" = ["util"]}
[[example]]
"name" = "agent"
"path" = "examples/agent.rs"
[[example]]
"name" = "databricks_oauth"
"path" = "examples/databricks_oauth.rs"
[[example]]
"name" = "test_whisper"
"path" = "examples/test_whisper.rs"
"required-features" = ["local-inference"]
[[bin]]
"name" = "goose-acp"
"path" = "src/bin/goose-acp.rs"
[[bin]]
"name" = "analyze_cli"
"path" = "src/bin/analyze_cli.rs"
"required-features" = ["tree-sitter"]
[[bin]]
"name" = "build_canonical_models"
"path" = "src/bin/build_canonical_models.rs"
[[bin]]
"name" = "generate-acp-schema"
"path" = "src/bin/generate_acp_schema.rs"
[workspace]
