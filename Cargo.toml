[workspace]
# Embedded Starlark (E-01) used by the service for progress parser scripts.
members = [".", "crates/starlark"]

[package]
name = "agentworks"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
agent-client-protocol = { version = "=3.4.0", features = ["process", "unstable_session_fork"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
pulldown-cmark = "0.13"
ammonia = "4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
libc = "0.2"
libghostty-vt = "=0.2.2"
agentworks-starlark = { path = "crates/starlark" }

