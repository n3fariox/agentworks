[workspace]
resolver = "3"
members = [
    "crates/agentworks",
    "crates/agentworks-codex-acp",
    "crates/agentworks-terminal",
    "crates/agentworks-runtime",
    "crates/agentworks-claude-acp",
    "crates/agentworks-demo-acp",
    "crates/agentworks-session",
    "crates/agentworks-workspace",
    "crates/agentworks-starlark",
]
default-members = ["crates/agentworks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
agent-client-protocol = { version = "=3.4.0", features = ["process", "unstable_session_fork", "unstable_subagents", "unstable_session_system_prompt"] }
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
uuid = { version = "1", features = ["v4"] }
