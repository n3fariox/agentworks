[package]
name = "agentworks-starlark"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "E-01 experiment: embedded Starlark progress parsers and workflow decisions. Not linked into the agentworks service."

[dependencies]
starlark = "=0.14.2"
# Already transitive dependencies of starlark/rusqlite; listed directly at the same versions.
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "=1.8.2"
libc = "0.2"

[[bin]]
name = "agentworks-starlark-worker"
path = "src/bin/worker.rs"
